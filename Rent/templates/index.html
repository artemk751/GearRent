<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GearRent: оренда спорядження</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1>GearRent</h1>
        <p>Оренда спорядження для походів, спорту та зйомки</p>
      </div>
    </header>
    <main class="container">
      <form id="filters" class="filters">
        <input id="search" type="search" placeholder="Пошук за назвою">
        <select id="category">
          <option value="">Усі категорії</option>
        </select>
        <select id="brand">
          <option value="">Усі бренди</option>
        </select>
        <select id="sort">
          <option value="">Без сортування</option>
          <option value="price_per_day">Ціна: від дешевших</option>
          <option value="-price_per_day">Ціна: від дорожчих</option>
          <option value="name">Назва: А-Я</option>
        </select>
      </form>
      <div id="message" class="message" hidden></div>
      <div id="products" class="grid"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
