$kind: http-request
name: "ПОМИЛКА 400: пропущені поля"
description: Не передано обов'язкові поля.
url: "{{base_url}}/products"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access}}
body:
  type: json
  content: |-
    {
      "name": "Тільки назва"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('bad_request'));
    language: text/javascript
order: 3000
