$kind: http-request
name: "ПОМИЛКА 400: неіснуюча категорія"
description: category_id вказує на неіснуючу категорію.
url: "{{base_url}}/products"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access}}
body:
  type: json
  content: |-
    {
      "name": "Рюкзак Osprey Talon 22",
      "description": "Об'єм 22 л",
      "price_per_day": 150.0,
      "category_id": 9999,
      "brand_id": 2,
      "is_available": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('bad_request'));
    language: text/javascript
examples: ./.resources/ПОМИЛКА 400- неіснуюча категорія.resources/examples
order: 2000
