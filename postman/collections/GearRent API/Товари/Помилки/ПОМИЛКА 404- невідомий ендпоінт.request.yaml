$kind: http-request
name: "ПОМИЛКА 404: невідомий ендпоінт"
description: JSON 404 у єдиному форматі.
url: "{{base_url}}/unknown"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('not_found'));
    language: text/javascript
order: 7000
