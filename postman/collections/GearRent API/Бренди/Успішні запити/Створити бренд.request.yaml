$kind: http-request
description: Створює бренд. 201.
url: "{{base_url}}/brands"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access}}
body:
  type: json
  content: |-
    {
      "name": "Salewa",
      "description": "Італійський бренд гірського спорядження"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.collectionVariables.set('brand_id', json.id);
      pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
