$kind: http-request
name: "ПОМИЛКА 409: видалити бренд з товарами"
description: Бренд «Husky» (id=1, демо-дані) має товари.
url: "{{base_url}}/brands/1"
method: DELETE
headers:
  Authorization: Bearer {{access}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('conflict'));
    language: text/javascript
examples: ./.resources/ПОМИЛКА 409- видалити бренд з товара.resources/examples
order: 1000
