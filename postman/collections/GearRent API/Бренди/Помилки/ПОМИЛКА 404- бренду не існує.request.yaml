$kind: http-request
name: "ПОМИЛКА 404: бренду не існує"
description: Неіснуючий id.
url: "{{base_url}}/brands/9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('not_found'));
    language: text/javascript
order: 2000
