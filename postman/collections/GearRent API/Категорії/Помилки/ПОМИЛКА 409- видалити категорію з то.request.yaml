$kind: http-request
name: "ПОМИЛКА 409: видалити категорію з товарами"
description: Категорію «Намети» (id=1, демо-дані) не можна видалити, поки в ній є товари.
url: "{{base_url}}/categories/1"
method: DELETE
headers:
  Authorization: Bearer {{access}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('conflict'));
    language: text/javascript
examples: ./.resources/ПОМИЛКА 409- видалити категорію з то.resources/examples
order: 4000
