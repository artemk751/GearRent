$kind: http-request
name: "ПОМИЛКА 409: дубль назви"
description: Категорія з такою назвою вже існує (без урахування регістру).
url: "{{base_url}}/categories"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access}}
body:
  type: json
  content: |-
    {
      "name": "намети"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('conflict'));
    language: text/javascript
examples: ./.resources/ПОМИЛКА 409- дубль назви.resources/examples
order: 2000
