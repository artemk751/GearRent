$kind: http-request
name: "ПОМИЛКА 400: порожня назва"
description: "Валідація: назва не може бути порожньою."
url: "{{base_url}}/categories"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access}}
body:
  type: json
  content: |-
    {
      "name": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Єдиний формат помилки', () => pm.expect(pm.response.json().error.code).to.eql('bad_request'));
    language: text/javascript
examples: ./.resources/ПОМИЛКА 400- порожня назва.resources/examples
order: 1000
