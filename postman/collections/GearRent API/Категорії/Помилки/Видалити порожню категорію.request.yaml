$kind: http-request
description: Категорія без товарів видаляється. 204.
url: "{{base_url}}/categories/{{category_id}}"
method: DELETE
headers:
  Authorization: Bearer {{access}}
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
